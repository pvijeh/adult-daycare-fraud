name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify Python
        run: |
          python -m compileall pipeline tests
          python -m pytest -q
      - name: Verify prose
        run: |
          npm run test:prose
          npm run prose-check

      - name: Verify Next.js
        run: |
          npm run typecheck
          npm run lint
          npm run build
